<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>M549-News</title>

</head>

<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        #main>h1 {
            margin-bottom: 60vh
        }

        .copyrights {
            width: 100%;
            text-align: center;
            margin-top: 25px;
            padding: 10px 0;
            background: #1d3557;
            color: white;
            font-size: large;

        }

        #main {
            width: 90%;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;

            padding-bottom: 30px;
        }
    </style>
    <header>
        <h1>📰M-549 News</h1>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search news...">
            <button onclick="searchNews()">Search</button>
        </div>
    </header>

    <h2 id="status"></h2>

    <div id="main">
        <h1 style="color:#1d3557 ; text-align:center">NEWS</h1>
    </div>


    <footer class="copyrights">
        <p>&copy; 2026 M-549 News. All rights reserved.</p>
        <p>
            <i class="fas fa-code"></i> Developer Mohammad wasayullah
        </p>
    </footer>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
